services:
  proxy:
    profiles:
      - disabled
  
  db:
    profiles:
      - disabled
  
  adminer:
    profiles:
      - disabled

  backend:
    depends_on: !reset []
    environment:
      FRONTEND_HOST: https://${NAME:-full_stack_fastapi_template}.${DOMAIN:-localhost}
      POSTGRES_SERVER: ${POSTGRES_SERVER:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Variable not set}@${POSTGRES_SERVER:-postgres}:5432/app
    labels: !override
      - traefik.enable=true
      - traefik.http.services.${NAME:-full_stack_fastapi_template}.loadbalancer.server.port=8000
      - traefik.http.routers.${NAME:-full_stack_fastapi_template}.rule=Host(`${NAME:-full_stack_fastapi_template}.${DOMAIN:-localhost}`)
      - traefik.http.routers.${NAME:-full_stack_fastapi_template}.entrypoints=websecure
      - traefik.http.routers.${NAME:-full_stack_fastapi_template}.tls=true
      - traefik.http.routers.${NAME:-full_stack_fastapi_template}.tls.certresolver=le
    networks:
      - traefik

networks:
  traefik:
    external: true
